name: EAS Build and Auto-Submit to TestFlight

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Install, Build and Submit to TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build and Submit to Apple TestFlight (iOS)
        run: eas build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

